name: Verify Devtime
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check app.js
          node --check scheduler.js
          node --check studio.js
          node --check sw.js
          node --check rescue.js
          node --check logbook-core.js
          node --check logbook.js
          node --check templates-core.js
          node --check templates.js
          node --check report-core.js
          node --check report.js
          node --check reminders-core.js
          node --check reminders.js
      - name: Schedule engine tests
        run: node --test tests/*.test.cjs
